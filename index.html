<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gala3D — Professional 3D Event Design & Floor Planner</title>
  <meta name="description" content="Gala3D is a modern, offline-first 3D event design and venue floor planning application for laptops, desktops, tablets, and phones." />
  <meta name="theme-color" content="#0b0f19" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23d4af37'%3E%3Cpath d='m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3Z'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./src/styles/app.css" />
</head>
<body>
  <div id="app">
    <!-- Top Action Toolbar -->
    <header class="toolbar" id="toolbar"></header>

    <!-- Main Workspace -->
    <main class="workspace">
      <!-- Left 3D Furniture & Decor Catalog -->
      <aside class="catalog-drawer" id="catalog-drawer"></aside>

      <!-- Center Interactive 3D WebGL Canvas Viewport -->
      <section id="viewport-container" tabindex="0"></section>

      <!-- Right Item Inspector & Venue Overview -->
      <aside class="inspector-drawer" id="inspector-drawer"></aside>
    </main>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
